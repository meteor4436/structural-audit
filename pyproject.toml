[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-audit"
version = "0.1.0"
description = "Reproducible ligand–receptor contact triage for PDB structures"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
structural-audit = "structural_audit.cli:main"

[tool.setuptools.packages.find]
include = ["structural_audit*"]
